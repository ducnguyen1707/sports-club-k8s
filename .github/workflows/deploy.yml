name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref — saves runner time on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NOTE ON `runs-on: ubuntu-latest` BELOW:
# That is GitHub's HOSTED CI RUNNER — a throwaway VM at GitHub that builds the
# image. It has nothing to do with the target cluster, whose nodes run
# Rocky Linux 9.8 on AWS EC2 (ap-south-1). The built image is Debian-based
# (php:8.3-apache) and runs on those Rocky nodes via containerd; a container's
# base OS does not need to match the host OS.

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sports-club

jobs:
  # ---------------------------------------------------------------------------
  # Cheap gate first: php -l takes seconds and catches syntax errors before we
  # spend a minute building a ~450MB image.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    container: php:8.3-cli
    steps:
      - uses: actions/checkout@v4
      - name: Lint vendored app + overrides
        # Jobs using `container:` default to `shell: sh`, which has no process
        # substitution. Upstream ships filenames with spaces (e.g. "new 1.php"),
        # so we need -print0 / read -d '' — hence bash explicitly.
        shell: bash
        run: |
          set -eu
          fail=0
          # Note: -print0/-0 because upstream has filenames with spaces
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null || { echo "SYNTAX ERROR: $f"; fail=1; }
          done < <(find app/Files docker/php-overrides -name '*.php' -print0)
          [ "$fail" -eq 0 ] && echo "All PHP files parse cleanly."
          exit "$fail"

  # ---------------------------------------------------------------------------
  # SAST: Static Application Security Testing with SonarQube/SonarCloud.
  # Scan the PHP code for bugs, security vulnerabilities, code smells.
  # Runs AFTER lint but doesn't block build (you can configure gating in
  # SonarCloud settings once you've established a baseline).
  # ---------------------------------------------------------------------------
  scan-code:
    runs-on: ubuntu-latest
    needs: lint
    # Only scan on main to avoid quota burn on every PR
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # Full history for SonarQube to detect deletions

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # Get from sonarcloud.io after signup
        with:
          args: >
            -Dsonar.projectKey=sports-club-k8s
            -Dsonar.organization=your-org

      # Optional: fail the job if quality gate fails (set in SonarCloud UI)
      # Remove this if you want scans to be informational only
      - name: Check SonarQube quality gate
        run: |
          echo "Quality gate result available at SonarCloud dashboard"
          echo "Configure 'fail pipeline' in SonarCloud project settings if desired"

  # ---------------------------------------------------------------------------
  # Manifests must render before we bother building an image.
  # ---------------------------------------------------------------------------
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with: { version: v1.35.6 }
      - name: kustomize build
        run: kubectl kustomize k8s/overlays/production > /dev/null && echo "manifests OK"

  # ---------------------------------------------------------------------------
  # Build on a GitHub-hosted runner: free (unlimited on public repos) and it's
  # the CPU-heavy step, so there's no reason to spend our own cluster on it.
  # ---------------------------------------------------------------------------
  build:
    needs: [lint, validate-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GITHUB_TOKEN can push to GHCR — no PAT needed
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # DAST: Scan the built container image for known vulnerabilities.
  # Uses Trivy (Open Source Container Scanner from Aqua Security).
  # Scans for CVEs in base image, installed packages, app dependencies.
  # Generates SBOM (Software Bill of Materials) for supply chain security.
  # Runs AFTER build but BEFORE deploy — gates deploy if CRITICAL found.
  # ---------------------------------------------------------------------------
  scan-image:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.build.outputs.tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Ignore vulnerabilities listed in .trivyignore (checked into repo)
          ignorefile: '.trivyignore'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: Run Trivy SBOM generation
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.build.outputs.tag }}
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-${{ needs.build.outputs.tag }}
          path: sbom.json
          retention-days: 90

      - name: Check Trivy results
        run: |
          echo "Image scan complete. Review results in:"
          echo "  GitHub Security tab (SARIF upload)"
          echo "  Artifacts (SBOM)"
          echo "If CRITICAL vulnerabilities exist, review before deploying."

  # ---------------------------------------------------------------------------
  # Deploy. Requires KUBE_CONFIG secret — a kubeconfig for the NAMESPACE-SCOPED
  # ServiceAccount (see README), not a cluster-admin one. If that credential
  # leaks, the blast radius is the sports-club namespace only.
  # ---------------------------------------------------------------------------
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, scan-image]
    runs-on: ubuntu-latest
    environment: production      # add required reviewers in repo settings for manual approval
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with: { version: v1.35.6 }

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # kubectl has kustomize BUILT IN, but not `kustomize edit` — that
      # subcommand only exists in the standalone CLI, so install it.
      - name: Install kustomize CLI
        run: |
          curl -sS "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Pin image tag in manifests
        working-directory: k8s/overlays/production
        run: |
          kustomize edit set image \
            "ghcr.io/OWNER/sports-club=${IMAGE}:${{ needs.build.outputs.tag }}"
          echo "--- resulting image ---"
          kustomize build . | grep 'image: ghcr.io'

      - name: Apply
        run: kubectl apply -k k8s/overlays/production

      - name: Wait for rollout
        run: |
          kubectl -n sports-club rollout status deployment/sports-club-app --timeout=180s
          kubectl -n sports-club get pods -o wide

  # ---------------------------------------------------------------------------
  smoke-test:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with: { version: v1.35.6 }
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Run smoke tests
        run: bash ci/smoke-test.sh
