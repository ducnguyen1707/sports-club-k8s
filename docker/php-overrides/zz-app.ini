; Shared session store so any pod can serve any user (see scale plan).
; Without this, PHP writes sessions to the pod's local disk and users get
; logged out whenever the load balancer routes them to a different replica.
session.save_handler = redis
session.save_path    = "tcp://redis:6379"

; REQUIRED for this app, not a tuning knob.
;
; 22 upstream files emit output (a stray blank line) BEFORE their opening
; <?php tag. secure_login.php is one of them, and it calls
; header("location: ./dashboard/admin/") after a successful login. With
; output_buffering off, that newline is flushed immediately, headers are
; already sent, and the redirect is silently dropped - login "succeeds"
; (the session is created in Redis) but the user gets a blank page.
;
; The official php image ships NO php.ini at all, so output_buffering
; defaults to 0. XAMPP - which this app was written for - and
; php.ini-production both set 4096. Matching that is what makes the app
; behave as its author intended, without editing vendored upstream files.
output_buffering = 4096

; Don't advertise PHP's version in headers
expose_php = Off

; Never render errors into the page; log them for operators instead
display_errors       = Off
display_startup_errors = Off
log_errors           = On
error_log            = /dev/stderr

; Modest limits — this app serves small CRUD pages
memory_limit       = 128M
max_execution_time = 30
