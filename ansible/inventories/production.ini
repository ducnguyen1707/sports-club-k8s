; ---------------------------------------------------------------------------
; Production cluster — 2-node RKE2 on AWS EC2, ap-south-1 (Mumbai)
; Node OS: Rocky Linux 9.8
;
; DISK SIZING LIVES HERE. To grow a node's root volume, change ebs_size_gb
; below and re-run:
;     ansible-playbook -i inventories/production.ini playbooks/resize-disk.yml
; The playbook is idempotent and generic over hosts — nothing is hardcoded.
;
; NOTE: AWS enforces a ~6 hour cooldown between modifications of the same
; volume, so size with headroom rather than nudging repeatedly.
; ---------------------------------------------------------------------------

[master]
rke2-master ansible_host=13.126.83.203 ebs_volume_id=vol-00e66a5f2e5a08e8b ebs_size_gb=20

; The worker has NO Elastic IP — its public address changes on every restart,
; so we address it by its stable PRIVATE IP and tunnel through the master,
; which does have a stable EIP. ProxyCommand (not ProxyJump) so the identity
; file is explicit on the jump hop too.
[worker]
rke2-worker ansible_host=172.31.34.225 ebs_volume_id=vol-021015865607ba4f4 ebs_size_gb=25 ansible_ssh_common_args='-o ProxyCommand="ssh -i ~/.ssh/rke2-mumbai.pem -W %h:%p -q -o StrictHostKeyChecking=accept-new rocky@13.126.83.203"'

[cluster:children]
master
worker

[cluster:vars]
ansible_user=rocky
ansible_ssh_private_key_file=~/.ssh/rke2-mumbai.pem
ansible_python_interpreter=/usr/bin/python3
ansible_host_key_checking=False
aws_region=ap-south-1
