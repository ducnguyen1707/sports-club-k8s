apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sports-club

resources:
  - mysql-service.yaml
  - mysql-statefulset.yaml
  - redis.yaml
  - app-deployment.yaml
  - app-service.yaml
  - app-ingress.yaml
  - app-hpa.yaml
  - app-pdb.yaml

configMapGenerator:
  - name: mysql-init
    files:
      - init.sql=mysql-init.sql
      - init-exporter.sh=mysql-init-exporter.sh

# ConfigMap name gets a content hash suffix; changing the SQL therefore
# triggers a rollout instead of silently leaving the old data in place.
generatorOptions:
  disableNameSuffixHash: false

commonLabels:
  app.kubernetes.io/part-of: sports-club
