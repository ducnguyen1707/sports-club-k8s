apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sports-club-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sports-club-app
  minReplicas: 2
  maxReplicas: 4      # aspirational: worker realistically fits ~3, see README
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
