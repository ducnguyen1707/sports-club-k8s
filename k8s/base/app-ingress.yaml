apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sports-club-app
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx      # rke2-ingress-nginx, already running
  rules:
    - host: sportsclub.local   # overridden per-overlay
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sports-club-app
                port:
                  number: 80
