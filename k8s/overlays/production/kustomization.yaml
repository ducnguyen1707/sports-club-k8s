apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# CI rewrites the newTag here via `kustomize edit set image`.
images:
  - name: ghcr.io/OWNER/sports-club
    newName: ghcr.io/OWNER/sports-club
    newTag: latest

# Set your real hostname here. For testing without DNS, nip.io works:
#   sportsclub.<worker-ip>.nip.io
patches:
  - target:
      kind: Ingress
      name: sports-club-app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: sportsclub.local
