apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# CI rewrites the newTag here via `kustomize edit set image`.
images:
  - name: ghcr.io/OWNER/sports-club
    newName: ghcr.io/ducnguyen1707/sports-club
    newTag: ef14c0a

# Real hostname for this environment. The base stays environment-agnostic;
# only this overlay knows the public name — the same pattern used for the
# image tag above.
patches:
  - target:
      kind: Ingress
      name: sports-club-app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: sportsclub.adminabc.click
      - op: replace
        path: /spec/tls/0/hosts/0
        value: sportsclub.adminabc.click
